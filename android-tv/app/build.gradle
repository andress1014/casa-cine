plugins { id 'com.android.application' }
def localSecrets = new Properties()
def secretsFile = rootProject.file('local-secrets.properties')
if (secretsFile.exists()) secretsFile.withInputStream { localSecrets.load(it) }
def tmdbKey = localSecrets.getProperty('TMDB_API_KEY', System.getenv('TMDB_API_KEY') ?: '')
if (!(tmdbKey ==~ /[a-f0-9]{32}/) && !tmdbKey.isEmpty()) throw new GradleException('TMDB_API_KEY inválida.')
android {
    namespace 'com.andress1014.casacine.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'com.andress1014.casacine.tv'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
        buildConfigField 'String', 'TMDB_API_KEY', '"' + tmdbKey + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'junit:junit:4.13.2'
}
